<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">
  <meta name="theme-color" content="#10b981">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #d1fae5;
      --danger: #ef4444;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-gradient); color: var(--text-main); display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .app-container { background: var(--card-bg); width: 100%; max-width: 500px; padding: 20px 16px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); align-self: flex-start; }
    
    .header-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; text-align: center; background: linear-gradient(to right, #10b981, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .nav-tabs { display: flex; background-color: #f1f5f9; padding: 4px; border-radius: var(--radius-md); margin-bottom: 12px; gap: 4px; }
    .nav-btn { flex: 1; padding: 8px 4px; border: none; background: none; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm); }
    .nav-btn.active { background-color: #ffffff; color: var(--primary-hover); box-shadow: var(--shadow-sm); }

    .sub-tabs { display: flex; background-color: #e2e8f0; padding: 3px; border-radius: var(--radius-sm); margin-bottom: 16px; gap: 4px; }
    .sub-btn { flex: 1; padding: 6px 4px; border: none; background: none; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
    .sub-btn.active { background-color: var(--primary); color: white; }

    .input-group { display: flex; gap: 8px; margin-bottom: 20px; position: relative; }
    .input-base { padding: 12px; border: 2px solid var(--border); border-radius: var(--radius-md); font-size: 16px; outline: none; background-color: #f8fafc; }
    .input-base:focus { background-color: #ffffff; border-color: var(--primary); }
    .input-qty { width: 70px; text-align: center; flex-shrink: 0; }
    .input-wrapper { position: relative; flex: 1; min-width: 0; }
    .input-wrapper input { width: 100%; }
    .btn-add { background-color: var(--primary); color: white; border: none; width: 48px; height: 48px; border-radius: var(--radius-md); font-size: 1.8rem; cursor: pointer; flex-shrink: 0; }
    
    /* Našeptávač */
    .autocomplete-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); max-height: 220px; overflow-y: auto; z-index: 100; }
    .autocomplete-item { padding: 12px 14px; font-size: 0.95rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .autocomplete-item:active { background-color: var(--primary-light); color: var(--primary-hover); }

    ul { list-style: none; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f8fafc; }
    .item-left { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
    .custom-checkbox { width: 24px; height: 24px; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .custom-checkbox svg { width: 12px; height: 12px; fill: none; stroke: white; stroke-width: 3; opacity: 0; }
    li.completed .custom-checkbox { background-color: var(--primary); border-color: var(--primary); }
    li.completed .custom-checkbox svg { opacity: 1; }
    li.completed .item-text { text-decoration: line-through; color: var(--text-muted); }
    .qty-badge { background-color: #f1f5f9; color: var(--text-main); font-size: 0.8rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; }
    .btn-delete { background: none; border: none; color: #cbd5e1; padding: 8px; cursor: pointer; }
    
    .frequent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
    .frequent-card { background: #f8fafc; border: 1px solid var(--border); padding: 10px; border-radius: var(--radius-md); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .frequent-title { font-size: 0.9rem; font-weight: 600; }
    .frequent-count { font-size: 0.75rem; color: var(--text-muted); }
    .btn-quick-add { background: var(--primary-light); color: var(--primary-hover); border: none; padding: 6px; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; }

    .empty-msg { text-align: center; color: var(--text-muted); padding: 24px 0; }
    .view-section { display: none; }
    .view-section.active { display: block; }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="header-title">Můj Nákup Live</h1>

    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchView('list', event)">🛒 Seznam</button>
      <button class="nav-btn" onclick="switchView('frequent', event)">⭐ Časté</button>
      <button class="nav-btn" onclick="switchView('history', event)">📜 Historie</button>
    </div>

    <div class="sub-tabs">
      <button class="sub-btn active" id="tab-food" onclick="switchCategory('food')">🍎 Potraviny & Nápoje</button>
      <button class="sub-btn" id="tab-kitchen" onclick="switchCategory('kitchen')">🍳 Kuchyně & Potřeby</button>
    </div>

    <!-- SEZNAM -->
    <div id="view-list" class="view-section active">
      <form id="todo-form" class="input-group">
        <input type="text" id="qty-input" class="input-base input-qty" placeholder="Ks" inputmode="decimal" />
        <div class="input-wrapper">
          <input type="text" id="todo-input" class="input-base" placeholder="Přidat položku..." autocomplete="off" autocorrect="off" spellcheck="false" required />
          <div id="autocomplete-list" class="autocomplete-list" style="display: none;"></div>
        </div>
        <button type="submit" class="btn-add">+</button>
      </form>
      <div id="active-items-container"></div>
    </div>

    <!-- ČASTÉ NÁKUPY -->
    <div id="view-frequent" class="view-section">
      <p style="font-size:0.85rem; color:var(--text-muted);">Nejčastěji kupované položky:</p>
      <div id="frequent-container" class="frequent-grid"></div>
    </div>

    <!-- HISTORIE -->
    <div id="view-history" class="view-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:0.85rem; color:var(--text-muted);">Již nakoupeno:</span>
        <button onclick="clearHistory()" style="background:none; border:none; color:var(--danger); font-size:0.8rem; cursor:pointer;">Vymazat historii</button>
      </div>
      <div id="history-items-container"></div>
    </div>
  </div>

  <script>
    // --- FIREBASE KONFIGURACE ---
    const firebaseConfig = {
  apiKey: "AIzaSyBF8jWnaYzL5SAu9R_WItfRpHWyOyoUl48",
  authDomain: "muuj-naakup.firebaseapp.com",
  databaseURL: "https://muuj-naakup-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "muuj-naakup",
  storageBucket: "muuj-naakup.firebasestorage.app",
  messagingSenderId: "615152397807",
  appId: "1:615152397807:web:86f2d003155cfe0fe09a1a",
  measurementId: "G-611CPJ58ZJ"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('shopping_list');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    // --- ROZŠÍŘENÁ DATABÁZE POLOŽEK PRO PREDIKTIVNÍ ZADÁVÁNÍ ---
   const categoryRules = {
  "Ovoce a zelenina": [
    // Ovoce
    "jablko", "banán", "pomeranč", "mandarinka", "citrón", "limetka", "grep", "grapefruit", 
    "hroznové víno", "jahoda", "malina", "borůvka", "ostružina", "broskev", "meruňka", 
    "nektarinka", "švestka", "meloun", "ananas", "mango", "avokádo", "kiwi", "fík", 
    "datle", "brusinka", "rybíz", "angrešt",

    "brambor", "mrkev", "cibule", "česnek", "rajče", "paprika", "okurka", "salát", 
    "špenát", "brokolice", "květák", "cuketa", "dýně", "lilek", "celer", "petržel",

    "kopr", "petrželka", "kukuřice", "hrášek", "fazole", "červená řepa", "zelí", "houba", "žampión"
  ],

  "Pečivo": [
    "chléb", "houska", "rohlík", "bageta", "vánočka", "toastový chléb", "koláč",

  ],

  "Mléčné a chladicí": [
    "mléko", "máslo", "sýr", "eidam", "gouda", "hermelín", "camembert", "niva", 
    "balkánský sýr", "mozzarella", "parmezán", "tvaroh", "jogurt", "smetana", 
    "šlehačka", "tavený sýr", "lučina", "žervé", "cottage", "pribináček", "termix",

  ],

    "šunka", "párek", "klobása", "slanina", "vysočina", "herkules", "poličan", 
    "špekáček", "jitrnice", "jelito", "tlačenka", "paštika", "ryba", "losos", 
    "treska", "kapr", "pstruh", "tuňák fresh", "kreveta"
  ],

  "Trvanlivé potraviny": [
    "mouka", "cukr", "sůl", "rýže", "těstoviny", "špagety", "kolínka", "vřetena", 
    "penne", "kuskus", "bulgur", "čočka", "olej", "olivový olej", "ocet", "balsamico", 
    "strouhanka", "krupice", "ovsené vločky", "müsli", "granola", "kečup", "tatarka", 
    "majronéza", "hořčice", "rajčatový protlak", "pesto", "konzerva", "tuňák", 
    "sardinka", "kompot", "džem", "marmeláda", "med", "nutella", "piškot", "koření", 
    "pepř", "kmín", "mletá paprika", "majoránka", "oregano", "skořice", "vanilka", 
    "kypřicí prášek", "prášek do pečiva", "vanilkový cukr", "kakao", "čokoláda na vaření", "bujón"
  ],

  "Pochutiny a sladkosti": [
    "čokoláda", "bonbón", "oplatka", "keks", "chipsy", "brambůrky", "oříšky", 
    "mandle", "kešu", "pistácie", "tyčinka", "žvýkačka", "popcorn"
  ],

  "Nápoje": [
    "voda", "minerálka", "pivo", "víno", "prosecco", "džus", "sirup", "šťáva", 
    "káva", "zrnková káva", "mletá káva", "espresso", "čaj", "černý čaj", 
    "zelený čaj", "ovocný čaj", "cola", "kofola", "fanta", "sprite", "tonic", 
    "energetický nápoj"
  ],

  "Drogerie a hygiena": [
    "toaletní papír", "kapesník", "vlhčený ubrousek", "mýdlo", "sprchový gel", 
    "šampón", "kondicionér", "zubní pasta", "zubní kartáček", "deodorant", 
    "voňavka", "holítko", "pěna na holení", "vložka", "tampón", "odličovač", "krém"
  ],

  "Domácnost a Úklid": [
    "jar", "saponát", "tablety do myčky", "sůl do myčky", "leštidlo", "prací prášek", 
    "prací gel", "aviváž", "čistič", "savo", "domestos", "houbička", "drátěnka", 
    "hadřík", "utěrka", "pytel na odpad", "sáček do koše", "alobal", "potravinová fólie", 
    "pečicí papír", "svíčka", "zapalovač", "baterie", "žárovka"
  ],

  "Kuchyňské vybavení": [
    "pánev", "hrnec", "kastrol", "poklice", "nůž", "prkénko", "vařečka", "sběračka", 
    "mísa", "miska", "talíř", "sklenice", "sklenička", "hrnek", "příbor", "vidlička", 
    "lžíce", "lžička", "otvírák", "vývrtka", "škrabka", "struhadlo", "cedník", "sítko", 
    "válek", "forma na pečení", "plech", "odměrka", "kuchyňská váha", "termoska", "dóza"
  ]
};

    let items = [];
    let currentCategory = 'food';
    let currentView = 'list';

    // Načítání v reálném čase z Firebase
    db.on('value', (snapshot) => {
      const data = snapshot.val();
      items = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
      renderAll();
    });

    const todoInput = document.getElementById('todo-input');
    const autocompleteList = document.getElementById('autocomplete-list');

    // Funkce pro odstranění diakritiky (pro snazší vyhledávání)
    function removeDiacritics(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    // Našeptávač logika
    todoInput.addEventListener('input', () => {
      const val = todoInput.value.trim();
      const normalizedVal = removeDiacritics(val);
      autocompleteList.innerHTML = '';

      if (normalizedVal.length < 2) {
        autocompleteList.style.display = 'none';
        return;
      }

      const matches = presetData[currentCategory].filter(item => 
        removeDiacritics(item).includes(normalizedVal)
      );

      if (matches.length === 0) {
        autocompleteList.style.display = 'none';
        return;
      }

      matches.forEach(match => {
        const div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.textContent = match;
        div.addEventListener('click', () => {
          todoInput.value = match;
          autocompleteList.style.display = 'none';
        });
        autocompleteList.appendChild(div);
      });

      autocompleteList.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
      if (!todoInput.contains(e.target) && !autocompleteList.contains(e.target)) {
        autocompleteList.style.display = 'none';
      }
    });

    function switchView(viewName, event) {
      currentView = viewName;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`view-${viewName}`).classList.add('active');
      renderAll();
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.getElementById('tab-food').classList.toggle('active', cat === 'food');
      document.getElementById('tab-kitchen').classList.toggle('active', cat === 'kitchen');
      autocompleteList.style.display = 'none';
      renderAll();
    }

    function renderAll() {
      renderActiveList();
      renderFrequent();
      renderHistory();
    }

    function getFilteredItems() {
      return items.filter(item => (item.type || 'food') === currentCategory);
    }

    function renderActiveList() {
      const container = document.getElementById('active-items-container');
      container.innerHTML = '';
      const activeItems = getFilteredItems().filter(i => !i.completed);

      if (activeItems.length === 0) {
        container.innerHTML = '<div class="empty-msg">Vše nakoupeno! 🛒</div>';
        return;
      }

      activeItems.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="item-left" onclick="toggleComplete('${item.id}', true)">
            <div class="custom-checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            ${item.qty ? `<span class="qty-badge">${item.qty}</span>` : ''}
            <span class="item-text">${item.text}</span>
          </div>
          <button class="btn-delete" onclick="deleteItem('${item.id}')">✕</button>
        `;
        container.appendChild(li);
      });
    }

    function renderHistory() {
      const container = document.getElementById('history-items-container');
      container.innerHTML = '';
      const completedItems = getFilteredItems().filter(i => i.completed);

      if (completedItems.length === 0) {
        container.innerHTML = '<div class="empty-msg">Žádné nakoupené položky.</div>';
        return;
      }

      completedItems.forEach(item => {
        const li = document.createElement('li');
        li.className = 'completed';
        li.innerHTML = `
          <div class="item-left" onclick="toggleComplete('${item.id}', false)">
            <div class="custom-checkbox"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <span class="item-text">${item.text}</span>
          </div>
          <button class="btn-delete" onclick="deleteItem('${item.id}')">✕</button>
        `;
        container.appendChild(li);
      });
    }

    function renderFrequent() {
      const container = document.getElementById('frequent-container');
      container.innerHTML = '';
      
      const categoryItems = getFilteredItems();
      const counts = {};
      categoryItems.forEach(i => {
        counts[i.text] = (counts[i.text] || 0) + (i.buyCount || 1);
      });

      const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 6);

      if (sorted.length === 0) {
        container.innerHTML = '<div class="empty-msg" style="grid-column: 1/-1;">Zatím chybí data pro časté nákupy.</div>';
        return;
      }

      sorted.forEach(([text, count]) => {
        const card = document.createElement('div');
        card.className = 'frequent-card';
        card.innerHTML = `
          <div>
            <div class="frequent-title">${text}</div>
            <div class="frequent-count">Koupeno ${count}x</div>
          </div>
          <button class="btn-quick-add" onclick="quickAdd('${text}')">+ Přidat</button>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('todo-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const qtyInput = document.getElementById('qty-input');
      
      if (!input.value.trim()) return;

      db.push({
        text: input.value.trim(),
        qty: qtyInput.value.trim(),
        type: currentCategory,
        completed: false,
        buyCount: 1,
        createdAt: Date.now()
      });

      input.value = '';
      qtyInput.value = '';
      autocompleteList.style.display = 'none';
    });

    function quickAdd(text) {
      db.push({ text, qty: '', type: currentCategory, completed: false, buyCount: 1, createdAt: Date.now() });
    }

    function toggleComplete(id, completed) {
      const item = items.find(i => i.id === id);
      const updates = { completed };
      if (completed) {
        updates.buyCount = (item.buyCount || 1) + 1;
      }
      db.child(id).update(updates);
    }

    function deleteItem(id) {
      db.child(id).remove();
    }

    function clearHistory() {
      getFilteredItems().filter(i => i.completed).forEach(i => db.child(i.id).remove());
    }
  </script>
</body>
