<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nákupní Seznam</title>
  
  <!-- Odkaz na PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">
  
  <!-- Podpora pro mobilní PWA (Web App) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nákupní Seznam">
  <meta name="theme-color" content="#10b981">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #d1fae5;
      --danger: #ef4444;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 20px 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      align-self: flex-start;
      margin-top: env(safe-area-inset-top, 0px);
      margin-bottom: env(safe-area-inset-bottom, 0px);
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
      background: linear-gradient(to right, #10b981, #059669);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      flex: 1;
      background-color: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-md);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      border: none;
      background: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: var(--primary-hover);
      box-shadow: var(--shadow-sm);
    }

    .btn-share {
      background-color: #f1f5f9;
      border: none;
      color: var(--primary-hover);
      padding: 0 12px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-share:active {
      background-color: var(--primary-light);
      transform: scale(0.96);
    }

    .btn-share svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      position: relative;
    }

    .input-base {
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
      background-color: #f8fafc;
    }

    .input-base:focus {
      background-color: #ffffff;
      border-color: var(--primary);
    }

    .input-qty {
      width: 70px;
      text-align: center;
      flex-shrink: 0;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .input-wrapper input {
      width: 100%;
    }

    .btn-add {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      font-size: 1.8rem;
      font-weight: 300;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-add:active {
      background-color: var(--primary-hover);
      transform: scale(0.96);
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      padding: 4px 0;
    }

    .autocomplete-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
    }

    .autocomplete-item:active, .autocomplete-item.selected {
      background-color: var(--primary-light);
      color: var(--primary-hover);
    }

    .ac-category {
      font-size: 0.75rem;
      background-color: #e2e8f0;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .category-group {
      margin-bottom: 20px;
      background: #ffffff;
      touch-action: pan-y;
    }

    .category-group.dragging {
      opacity: 0.4;
      background: #f1f5f9;
    }

    .category-header {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid #f1f5f9;
      display: flex;
      align-items: center;
      user-select: none;
    }

    .category-header::before {
      content: "⋮⋮";
      margin-right: 10px;
      color: #cbd5e1;
      font-size: 1.2rem;
      letter-spacing: -2px;
      padding: 4px;
    }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f8fafc;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
      min-width: 0;
      padding: 4px 0;
    }

    .custom-checkbox {
      width: 26px;
      height: 26px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s;
    }

    li.completed .custom-checkbox {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    li.completed .custom-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    li.completed .item-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li.completed .qty-badge {
      opacity: 0.5;
    }

    .qty-badge {
      background-color: #f1f5f9;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .item-text {
      font-size: 0.95rem;
      font-weight: 500;
      word-break: break-word;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #cbd5e1;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .btn-delete svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-delete:active {
      color: var(--danger);
      background-color: #fee2e2;
    }

    .empty-message {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    
    .empty-message span {
      font-size: 2.2rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1 class="header-title">Můj Nákup</h1>
    
    <div class="top-controls">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-food">🍎 Potraviny</button>
        <button type="button" class="tab-btn" id="tab-kitchen">🍳 Kuchyně</button>
      </div>
      <button type="button" class="btn-share" id="btn-share" title="Sdílet seznam přes WhatsApp / SMS">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
        Sdílet
      </button>
    </div>

    <form id="todo-form" class="input-group">
      <input type="text" id="qty-input" class="input-base input-qty" placeholder="Ks/kg" inputmode="decimal" autocomplete="off" />
      <div class="input-wrapper">
        <input type="text" id="todo-input" class="input-base" placeholder="Co koupit?" autocomplete="off" autocorrect="off" spellcheck="false" required />
        <div id="autocomplete-list" class="autocomplete-list" style="display: none;"></div>
      </div>
      <button type="submit" class="btn-add" title="Přidat">+</button>
    </form>

    <div id="sections-container"></div>
    <div id="empty-msg" class="empty-message">
      <span>🛒</span>
      <p>Seznam je zatím prázdný.</p>
    </div>
  </div>

  <script>
    // Registrace Service Workeru pro PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch(err => console.log('ServiceWorker registrace selhala: ', err));
      });
    }

    const foodData = {
      "Ovoce a zelenina": ["Jablka", "Banány", "Citrony", "Brambory", "Cibule", "Česnek", "Mrkev", "Rajčata", "Okurka", "Paprika", "Salát", "Brokolice"],
      "Pečivo": ["Chléb", "Rohlíky", "Housky", "Bageta", "Toustový chléb", "Vánočka"],
      "Mléčné výrobky a vejce": ["Mléko", "Máslo", "Vejce", "Bílý jogurt", "Eidam", "Gouda", "Mozzarella", "Tvaroh", "Smetana"],
      "Maso a uzeniny": ["Kuřecí prsa", "Mleté maso", "Šunka", "Párky", "Slanina", "Klobása"],
      "Trvanlivé a obiloviny": ["Rýže", "Těstoviny", "Ovesné vločky", "Mouka hladká", "Cukr krystal", "Olej", "Fazole v konzervě"],
      "Ostatní potraviny": ["Káva", "Čaj", "Voda", "Džus", "Čokoláda", "Sůl", "Pepř", "Kečup", "Majonéza"]
    };

    const kitchenData = {
      "Pečení a balení": ["Pečicí papír", "Alobal", "Potravinová fólie", "Sáčky na svačinu", "Sáčky do mrazáku"],
      "Úklid kuchyně": ["Jar na nádobí", "Houbičky", "Kapsle do myčky", "Sůl do myčky", "Papírové utěrky", "Pytle do koše"],
      "Nádobí a náčiní": ["Hrnec", "Pánev", "Vařečka", "Nůž", "Prkénko", "Sklenice", "Talíře"]
    };

    let currentTab = 'food';

    function getCurrentCategories() {
      return currentTab === 'food' ? foodData : kitchenData;
    }

    function getStorageKeys() {
      return {
        itemsKey: currentTab === 'food' ? 'shopList_Food' : 'shopList_Kitchen',
        orderKey: currentTab === 'food' ? 'shopOrder_Food' : 'shopOrder_Kitchen'
      };
    }

    function getDatabase() {
      const data = getCurrentCategories();
      return Object.entries(data).flatMap(([category, items]) => 
        items.map(name => ({ name, category }))
      );
    }

    const form = document.getElementById('todo-form');
    const qtyInput = document.getElementById('qty-input');
    const input = document.getElementById('todo-input');
    const sectionsContainer = document.getElementById('sections-container');
    const emptyMsg = document.getElementById('empty-msg');
    const autocompleteList = document.getElementById('autocomplete-list');
    const tabFood = document.getElementById('tab-food');
    const tabKitchen = document.getElementById('tab-kitchen');
    const btnShare = document.getElementById('btn-share');

    let items = [];
    let categoryOrder = [];

    function loadState() {
      const { itemsKey, orderKey } = getStorageKeys();
      items = JSON.parse(localStorage.getItem(itemsKey)) || [];
      categoryOrder = JSON.parse(localStorage.getItem(orderKey)) || Object.keys(getCurrentCategories()).concat("Ostatní");
    }

    function saveState() {
      const { itemsKey, orderKey } = getStorageKeys();
      localStorage.setItem(itemsKey, JSON.stringify(items));
      localStorage.setItem(orderKey, JSON.stringify(categoryOrder));
    }

    function removeDiacritics(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function findCategory(itemName) {
      const db = getDatabase();
      const match = db.find(i => removeDiacritics(i.name) === removeDiacritics(itemName));
      return match ? match.category : "Ostatní";
    }

    function closeAutocomplete() {
      autocompleteList.innerHTML = '';
      autocompleteList.style.display = 'none';
    }

    function renderList() {
      sectionsContainer.innerHTML = '';
      emptyMsg.style.display = items.length === 0 ? 'flex' : 'none';

      if (items.length === 0) return;

      const grouped = items.reduce((acc, item) => {
        const cat = item.category || "Ostatní";
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(item);
        return acc;
      }, {});

      categoryOrder.forEach(category => {
        if (!grouped[category] || grouped[category].length === 0) return;

        const groupEl = document.createElement('div');
        groupEl.className = 'category-group';
        groupEl.dataset.category = category;

        const header = document.createElement('div');
        header.className = 'category-header';
        header.textContent = category;
        groupEl.appendChild(header);

        const ul = document.createElement('ul');

        grouped[category].forEach(item => {
          const originalIndex = items.findIndex(i => i.id === item.id);
          const li = document.createElement('li');
          if (item.completed) li.classList.add('completed');

          const leftDiv = document.createElement('div');
          leftDiv.className = 'item-left';

          const checkboxDiv = document.createElement('div');
          checkboxDiv.className = 'custom-checkbox';
          checkboxDiv.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
          leftDiv.appendChild(checkboxDiv);

          if (item.qty) {
            const qtySpan = document.createElement('span');
            qtySpan.className = 'qty-badge';
            qtySpan.textContent = item.qty;
            leftDiv.appendChild(qtySpan);
          }

          const span = document.createElement('span');
          span.className = 'item-text';
          span.textContent = item.text;
          leftDiv.appendChild(span);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-delete';
          deleteBtn.type = 'button';
          deleteBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

          leftDiv.addEventListener('click', () => {
            items[originalIndex].completed = !items[originalIndex].completed;
            saveState();
            renderList();
          });

          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            items.splice(originalIndex, 1);
            saveState();
            renderList();
          });

          li.appendChild(leftDiv);
          li.appendChild(deleteBtn);
          ul.appendChild(li);
        });

        groupEl.appendChild(ul);
        sectionsContainer.appendChild(groupEl);
      });

      setupTouchAndDrag();
    }

    function setupTouchAndDrag() {
      const groups = document.querySelectorAll('.category-group');
      let activeGroup = null;

      groups.forEach(group => {
        const header = group.querySelector('.category-header');

        header.addEventListener('touchstart', (e) => {
          activeGroup = group;
          group.classList.add('dragging');
        }, { passive: true });

        header.addEventListener('touchend', () => {
          if (!activeGroup) return;
          activeGroup.classList.remove('dragging');
          activeGroup = null;
          updateCategoryOrder();
        });

        header.addEventListener('touchmove', (e) => {
          if (!activeGroup) return;
          const touchLocation = e.touches[0];
          const targetEl = document.elementFromPoint(touchLocation.clientX, touchLocation.clientY);
          const targetGroup = targetEl?.closest('.category-group');

          if (targetGroup && targetGroup !== activeGroup) {
            const rect = targetGroup.getBoundingClientRect();
            const next = (touchLocation.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
            sectionsContainer.insertBefore(activeGroup, next ? targetGroup.nextSibling : targetGroup);
          }
        }, { passive: true });
      });

      function updateCategoryOrder() {
        const newOrder = Array.from(sectionsContainer.children).map(el => el.dataset.category);
        categoryOrder = [...new Set([...newOrder, ...categoryOrder])];
        saveState();
      }
    }

    function shareList() {
      const pendingItems = items.filter(i => !i.completed);
      
      if (pendingItems.length === 0) {
        alert('Nákupní seznam je prázdný nebo jsou všechny položky již nakoupeny.');
        return;
      }

      const categoryName = currentTab === 'food' ? 'Potraviny' : 'Kuchyně';
      let shareText = `🛒 *Nákupní Seznam (${categoryName})*\n\n`;

      const grouped = pendingItems.reduce((acc, item) => {
        const cat = item.category || "Ostatní";
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(item);
        return acc;
      }, {});

      categoryOrder.forEach(cat => {
        if (grouped[cat] && grouped[cat].length > 0) {
          shareText += `📌 *${cat}*\n`;
          grouped[cat].forEach(i => {
            const qtyStr = i.qty ? `(${i.qty}) ` : '';
            shareText += `• ${qtyStr}${i.text}\n`;
          });
          shareText += `\n`;
        }
      });

      if (navigator.share) {
        navigator.share({
          title: `Nákupní seznam - ${categoryName}`,
          text: shareText.trim()
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareText.trim()).then(() => {
          alert('Seznam byl zkopírován do schránky!');
        });
      }
    }

    input.addEventListener('input', () => {
      const query = input.value.trim();
      const normalizedQuery = removeDiacritics(query);
      closeAutocomplete();

      if (normalizedQuery.length < 2) return;

      const db = getDatabase();
      const matches = db.filter(item => removeDiacritics(item.name).includes(normalizedQuery));

      if (matches.length === 0) return;

      matches.forEach((match) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'autocomplete-item';
        itemDiv.innerHTML = `<span>${match.name}</span><span class="ac-category">${match.category}</span>`;

        itemDiv.addEventListener('click', () => {
          input.value = match.name;
          input.dataset.selectedCategory = match.category;
          closeAutocomplete();
        });

        autocompleteList.appendChild(itemDiv);
      });

      autocompleteList.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
      if (!input.contains(e.target) && !autocompleteList.contains(e.target)) {
        closeAutocomplete();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      const qty = qtyInput.value.trim();
      if (!text) return;

      const category = input.dataset.selectedCategory || findCategory(text);

      items.unshift({ id: Date.now(), text, qty, category, completed: false });

      delete input.dataset.selectedCategory;
      saveState();
      renderList();

      input.value = '';
      qtyInput.value = '';
      closeAutocomplete();
      
      input.blur();
      qtyInput.blur();
    });

    tabFood.addEventListener('click', () => {
      if (currentTab === 'food') return;
      currentTab = 'food';
      tabFood.classList.add('active');
      tabKitchen.classList.remove('active');
      loadState();
      renderList();
    });

    tabKitchen.addEventListener('click', () => {
      if (currentTab === 'kitchen') return;
      currentTab = 'kitchen';
      tabKitchen.classList.add('active');
      tabFood.classList.remove('active');
      loadState();
      renderList();
    });

    btnShare.addEventListener('click', shareList);

    loadState();
    renderList();
  </script>
</body>
</html>
